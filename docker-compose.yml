services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fit4110-camera-api-lab05
    env_file:
      - .env.example
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      analytics-mock:
        condition: service_healthy
    networks:
      - team-internal
      - class-net
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:15-alpine
    container_name: fit4110-camera-db-lab05
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lab05}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab05pass}
      POSTGRES_DB: ${POSTGRES_DB:-cameradb}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - team-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lab05} -d ${POSTGRES_DB:-cameradb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    image: python:3.11-slim
    container_name: fit4110-camera-vision-mock-lab05
    working_dir: /service
    volumes:
      - ./src/ai_service:/service:ro
    command: ["sh", "-c", "pip install --no-cache-dir fastapi==0.115.6 uvicorn[standard]==0.34.0 pydantic==2.10.4 >/tmp/pip.log && python main.py"]
    ports:
      - "9000:9000"
    networks:
      - team-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  analytics-mock:
    image: python:3.11-slim
    container_name: fit4110-camera-analytics-mock-lab05
    working_dir: /service
    volumes:
      - ./src/analytics_mock:/service:ro
    command: ["sh", "-c", "pip install --no-cache-dir fastapi==0.115.6 uvicorn[standard]==0.34.0 pydantic==2.10.4 >/tmp/pip.log && uvicorn main:app --host 0.0.0.0 --port 9010"]
    ports:
      - "9010:9010"
    networks:
      - team-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9010/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  team-internal:
    driver: bridge
  class-net:
    driver: bridge

volumes:
  db-data:
